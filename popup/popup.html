<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Image Save As</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <h1>Image Save As</h1>
    </header>

    <label class="toggle">
      <span>Enable right-click menu</span>
      <input type="checkbox" id="enabled" role="switch" />
    </label>

    <p id="status" class="status"></p>

    <fieldset id="settings">
      <label class="toggle">
        <span>Ask where to save each file</span>
        <input type="checkbox" id="askWhereToSave" role="switch" />
      </label>

      <label class="slider" for="quality">
        <span class="slider-label">
          <span>JPEG / WEBP quality</span>
          <output id="qualityValue" for="quality"></output>
        </span>
        <input type="range" id="quality" min="50" max="100" step="1" />
      </label>
    </fieldset>

    <p id="error" class="error" hidden></p>
  </body>
</html>
