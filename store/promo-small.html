<!doctype html>
<!-- Source for promo-small.png (440×280). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=440,280 --screenshot=store/promo-small.png store/promo-small.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        padding: 0 36px;
        box-sizing: border-box;
        background: linear-gradient(135deg, #1d4ed8, #2563eb 60%, #3b82f6);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.35;
        opacity: 0.92;
      }
      .formats {
        display: flex;
        gap: 8px;
      }
      .formats span {
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../icons/icon128.png" alt="" />
      <h1>Image Save As</h1>
    </header>
    <p>Right-click any image and save it in the format you want.</p>
    <div class="formats"><span>PNG</span><span>JPEG</span><span>WEBP</span><span>Original</span></div>
  </body>
</html>
